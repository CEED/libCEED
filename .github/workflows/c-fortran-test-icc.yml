name: ICX and IFX

on:
  push:
    branches:
      - main
  pull_request:

env:
  LINUX_CPP_COMPONENTS: intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic
  LINUX_FORTRAN_COMPONENTS: intel-oneapi-compiler-fortran

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Environment setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Intel compilers
        uses: rscohn2/setup-oneapi@9ac2e22dab93541676ee39841d702c35ee0b8e4c
        with:
          components: |
            icx
            ifx
      - name: Build and test libCEED
        env:
          CEED_CACHE_BASE_DIR: $PWD/temp
          CEED_JIT_ERROR_ON_FAILURE: 1
        run: |
          source /opt/intel/oneapi/setvars.sh
          export CC=icx CXX=icpx FC=ifx
          export OPENMP=1
          make info
          make -j
          make JUNIT_BATCH="${{ matrix.os }}-${{ matrix.compiler }}" junit -j
