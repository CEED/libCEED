name: IBM Power

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Environment setup
      uses: actions/checkout@v5
    - name: Install cross toolchain and QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user gcc-powerpc64le-linux-gnu gfortran-powerpc64le-linux-gnu
    - name: Build libCEED for ppc64le
      env:
        CC: powerpc64le-linux-gnu-${{ matrix.compiler }}
        CXX: powerpc64le-linux-gnu-g++
        FC: powerpc64le-linux-gnu-gfortran
        OPT: -O2 -g -ffp-contract=fast
      run: |
        make info
        make -j4
        file lib/libceed.so | grep -F 'PowerPC'
    - name: Test libCEED under QEMU
      env:
        CC: powerpc64le-linux-gnu-${{ matrix.compiler }}
        CXX: powerpc64le-linux-gnu-g++
        FC: powerpc64le-linux-gnu-gfortran
        OPT: -O2 -g -ffp-contract=fast
        CEED_TEST_RUNNER: qemu-ppc64le -L /usr/powerpc64le-linux-gnu
      run: |
        make -j4 build/t000-ceed
        file build/t000-ceed | grep -F 'PowerPC'
        $CEED_TEST_RUNNER build/t000-ceed /cpu/self/ref/serial
        make JUNIT_BATCH="${{ matrix.os }}-${{ matrix.compiler }}" junit -j4
