name: ABI Compatibility Test

on:
  pull_request:

env:
  CEED_HEADERS: '{0}/ceed/backend.h {0}/ceed/ceed.h {0}/ceed/macros.h {0}/ceed/ceed-env.h'

jobs:
  abicheck:
    strategy:
      matrix:
        compiler: [gcc, clang]

    runs-on: ubuntu-latest

    name: abicheck [${{ matrix.compiler }}]

    steps:
    - name: Checkout libCEED (branch)
      uses: actions/checkout@v5
      with:
        path: libCEED

    - name: Checkout libCEED (release)
      uses: actions/checkout@v5
      with:
        ref: release
        path: libCEED-release

    - name: Set compiler
      run: |
        case "${{ matrix.compiler }}" in
          gcc)
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
            echo "FC=gfortran" >> $GITHUB_ENV
            ;;
          clang)
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
            echo "FC=" >> $GITHUB_ENV
            ;;
        esac

    - name: Show compiler version
      run: $CC --version | head -1

    - name:  Build libCEED (branch)
      env:
        OPT: -Og -g -fno-eliminate-unused-debug-types
      run: |
        cd libCEED
        make info
        NUM_JOBS=$(getconf _NPROCESSORS_ONLN)
        make -j$NUM_JOBS

    - name:  Build libCEED (release)
      env:
        OPT: -Og -g -fno-eliminate-unused-debug-types
      run: |
        cd libCEED-release
        make info
        NUM_JOBS=$(getconf _NPROCESSORS_ONLN)
        make -j$NUM_JOBS

    - name: Check ABI compatibility
      uses: abicheck/abicheck@v0.6.0
      with:
        old-library: libCEED-release/lib/libceed.so
        old-header: ${{ format(env.CEED_HEADERS, 'libCEED-release/include') }}
        new-library: libCEED/lib/libceed.so
        new-header: ${{ format(env.CEED_HEADERS, 'libCEED/include') }}
        annotate: true
