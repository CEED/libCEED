name: C/Fortran - Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout libCEED (branch)
      uses: actions/checkout@v5

    - name: Checkout libCEED (main)
      uses: actions/checkout@v5
      with:
        ref: main
        path: libCEED-mainhttps://app.zoom.us/wc/3907832807/start?ref_from=launch&fromPWA=1

    - name: Set compiler
      run: |
        case "${{ matrix.compiler }}" in
          gcc)
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
            echo "FC=gfortran" >> $GITHUB_ENV
            echo "GCOV=gcov" >> $GITHUB_ENV
            ;;
          clang)
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
            echo "FC=" >> $GITHUB_ENV
            echo "GCOV=llvm-cov --gcov-tool gcov" >> $GITHUB_ENV
            # Test that the default compiler works at runtime
            echo "CEED_CPU_JIT_CXX=" >> $GITHUB_ENV
            ;;
        esac

    - name: Checkout ABICC
      uses: actions/checkout@v4
      with:
        repository: lvc/abi-compliance-checker
        ref: 2.3
        path: external/abicc

    - name: Build ABI Compliance Checker
      run: |
        cd external/abicc
        sudo make install prefix=/usr
