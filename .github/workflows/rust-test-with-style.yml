name: Rust

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        compiler: [clang]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Environment setup
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Rust setup
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        # Note: nightly required for coverage of Doctests
        toolchain: nightly
        components: llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: cargo-llvm-cov
    - name: Rust test with coverage
      env:
        CC: ${{ matrix.compiler }}
        FC: gfortran
        CEED_CACHE_BASE_DIR: $PWD/temp
        CEED_JIT_ERROR_ON_FAILURE: 1
      run: |
        export CARGO_CEED_OPT_FLAGS="-g -O0 -fno-inline"
        cargo llvm-cov test --doctests --lcov --output-path coverage.info
    - name: Codecov upload
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      if: ${{ runner.os == 'Linux' }}
      with:
        files: coverage.info
        plugins: noop
        token: ${{ secrets.CODECOV_TOKEN }}


  style:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        compiler: [clang]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Environment setup
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Rust setup
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        # Note: rustfmt not always included in nightly, will attempt to downgrade until rustfmt found
        toolchain: nightly
        components: rustfmt
    - name: Rust style
      run: |
        cargo +nightly fmt --version
        cargo +nightly fmt -- --check
