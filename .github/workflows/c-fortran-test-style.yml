name: Style

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  c_style:
    strategy:
      matrix:
        os: [ubuntu-26.04]
        compiler: [clang]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Environment setup
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install clang-format
      run: |
          sudo apt install clang-format-22
    - name: C style
      env:
        CC: ${{ matrix.compiler }}
        FC: gfortran
      run: |
        make info
        make format-c -j CLANG_FORMAT=clang-format-22 && git diff --exit-code
