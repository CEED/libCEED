name: ARM

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm]
        compiler: [gcc, clang]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Environment setup
      uses: actions/checkout@v5
    - name: Build and test libCEED
      env:
        CC: ${{ matrix.compiler }}
        FC: gfortran
      run: |
        make info
        make -j4
        make -j4 PROVE_OPTS=-j4 prove

  test-sve:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm]
        compiler: [gcc, clang]
        precision: [fp64, fp32]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Environment setup
      uses: actions/checkout@v5
    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-user
    - name: Configure precision
      if: matrix.precision == 'fp32'
      run: sed -i 's/#include "ceed-f64.h"/#include "ceed-f32.h"/' include/ceed/types.h
    - name: Build SVE test suite
      env:
        CC: ${{ matrix.compiler }}
        FC: ${{ matrix.precision == 'fp64' && 'gfortran' || '' }}
        SVE_OPT: -O2 -g -ffp-contract=fast -march=armv8-a+sve
      run: |
        make -j4 OPT="$SVE_OPT"
        make info OPT="$SVE_OPT" | tee build/sve-info.log
        grep -F 'SVE_STATUS    = Enabled' build/sve-info.log
    - name: Run SVE full suite at multiple vector lengths
      env:
        CC: ${{ matrix.compiler }}
        FC: ${{ matrix.precision == 'fp64' && 'gfortran' || '' }}
        LD_LIBRARY_PATH: ${{ github.workspace }}/lib
        SVE_OPT: -O2 -g -ffp-contract=fast -march=armv8-a+sve
      run: |
        cat >build/sve-vector-length.c <<'EOF'
        #include <arm_sve.h>
        #include <stdio.h>
        int main(void) {
          printf("%zu\n", svcntb() * 8);
          return 0;
        }
        EOF
        ${{ matrix.compiler }} -O2 -march=armv8-a+sve build/sve-vector-length.c -o build/sve-vector-length
        for vq in 1 16; do
          cpu="max,sve-max-vq=$vq,sve-default-vector-length=$((16 * vq))"
          bits=$(qemu-aarch64 -cpu "$cpu" build/sve-vector-length)
          echo "vq=$vq bits=$bits"
          test "$bits" -eq "$((128 * vq))"
          CEED_TEST_RUNNER="qemu-aarch64 -cpu $cpu" make -j4 OPT="$SVE_OPT" PROVE_OPTS=-j4 prove
        done
